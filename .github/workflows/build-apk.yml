
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: unzip twitch_auto_collector_project.zip -d source

      
      - name: Fix Java Version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/TwitchAutoCollector/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              '    compileSdk = 35',
              '''    compileSdk = 35
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }'''
          )
          p.write_text(s)
          PY

      
      - name: Fix Kotlin Code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/TwitchAutoCollector/app/src/main/java/tw/nero/twitchautocollector/TwitchAccessibilityService.kt")
          s = p.read_text()
          s = s.replace(
              'val signature = "${candidate.text}|${candidate.viewIdResourceName}|${candidate.boundsInScreen}"',
              'val signature = "${candidate.text}|${candidate.viewIdResourceName}"'
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p source/TwitchAutoCollector assembleDebug



      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TwitchAutoCollector-APK
          path: source/TwitchAutoCollector/app/build/outputs/apk/debug/*.apk
